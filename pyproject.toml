[project]
name = "train-boudless-das"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepspeed>=0.19.1",
    "huggingface-hub>=1.18.0",
    "hydra-core>=1.3.3",
    "omegaconf>=2.3.1",
    "pyvene>=0.1.8",
    # macOS -> regular PyTorch (supports MPS)
    "ruff>=0.15.18",
    "torch==2.11.0; sys_platform == 'darwin'",
    # Linux -> CUDA wheel from pytorch-cu128 index
    "torch==2.11.0; sys_platform == 'linux'",
    "vastai>=1.1.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
]
